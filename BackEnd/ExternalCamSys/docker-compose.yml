services:
  # PHP Application Service
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: externalcamsys_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - externalcamsys_network

  # Nginx Web Server Service
  nginx:
    image: nginx:alpine
    container_name: externalcamsys_nginx
    ports:
      - "8003:80" # Access the app at http://localhost:8003
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - externalcamsys_network

  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: externalcamsys_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    volumes:
      - externalcamsys_db_data:/var/lib/mysql
    ports:
      - "3308:3306" # Access the DB from outside at port 3308 if needed
    networks:
      - externalcamsys_network

  # phpMyAdmin Service
  phpmyadmin:
    image: phpmyadmin
    container_name: externalcamsys_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80" # Access phpMyAdmin at http://localhost:8080
    environment:
      PMA_HOST: db # Tells phpMyAdmin to connect to our 'db' service
      PMA_PORT: 3306 # The internal port of the MySQL container
    networks:
      - externalcamsys_network
    depends_on:
      - db

# Docker Networks
networks:
  externalcamsys_network:
    driver: bridge

# Docker Volumes
volumes:
  externalcamsys_db_data:
    driver: local