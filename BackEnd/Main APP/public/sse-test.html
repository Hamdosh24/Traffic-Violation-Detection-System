<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراقب الحوادث المباشر</title>
    <style>
        /* Import a clean, modern font */
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');

        :root {
            --background-color: #f8f9fa;
            --card-background: #ffffff;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --accent-color: #dc3545;
            --border-color: #dee2e6;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 2.5rem;
            background-color: var(--background-color);
            color: var(--text-primary);
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
        }

        .header h1 {
            color: var(--text-primary);
            margin: 0;
            font-size: 2rem;
        }

        .status-dot {
            height: 12px;
            width: 12px;
            background-color: #6c757d; /* Default: disconnected */
            border-radius: 50%;
            margin-right: 15px;
            transition: background-color 0.3s ease;
        }

        .status-dot.live {
            background-color: #28a745; /* Green: connected */
            animation: pulse 2s infinite;
        }
        
        .status-dot.error {
            background-color: var(--accent-color); /* Red: error */
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(40, 167, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
        }

        #accidents-list {
            list-style-type: none;
            padding: 0;
        }

        .accident-item {
            background-color: var(--card-background);
            margin-bottom: 1rem;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            border-right: 5px solid var(--accent-color);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1.5rem;
            opacity: 0;
            transform: scale(0.95);
            animation: popIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        
        .placeholder {
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.2rem;
            padding: 3rem;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
        }

        .info-group {
            display: flex;
            flex-direction: column;
        }
        
        .info-label {
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .info-value {
            font-weight: 700;
            font-size: 1.1em;
            color: var(--text-primary);
        }
        
        @keyframes popIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span id="status-indicator" class="status-dot"></span>
            <h1>لوحة مراقبة الحوادث المباشرة</h1>
        </div>
        
        <ul id="accidents-list">
            <div id="placeholder" class="placeholder">
                في انتظار وصول إشعارات حوادث جديدة...
            </div>
        </ul>
    </div>

    <script>
        const list = document.getElementById('accidents-list');
        const placeholder = document.getElementById('placeholder');
        const statusIndicator = document.getElementById('status-indicator');

        const eventSource = new EventSource('http://127.0.0.1:8002/api/admin/accidents/stream');

        // Event listener for new accidents
        eventSource.addEventListener('new-accident', event => {
            // Hide the placeholder message if it's visible
            if (placeholder) {
                placeholder.style.display = 'none';
            }
            
            const accident = JSON.parse(event.data);
            console.log('New accident received:', accident);

            const cameraNumber = accident.camera.camera_id;
            const location = `${accident.camera.street}, ${accident.camera.region}`;
            const time = new Date(accident.timestamp).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            const newLi = document.createElement('li');
            newLi.className = 'accident-item';
            
            newLi.innerHTML = `
                <div class="info-group">
                    <span class="info-label">كاميرا رقم</span>
                    <span class="info-value">${cameraNumber}</span>
                </div>
                <div class="info-group">
                    <span class="info-label">الموقع</span>
                    <span class="info-value">${location}</span>
                </div>
                <div class="info-group">
                    <span class="info-label">وقت الحادث</span>
                    <span class="info-value">${time}</span>
                </div>
            `;
            
            list.prepend(newLi);
        });

        // Handle connection opening
        eventSource.onopen = () => {
            console.log('Connection to SSE stream established.');
            statusIndicator.className = 'status-dot live';
        };

        // Handle connection errors
        eventSource.onerror = error => {
            console.error('EventSource connection failed:', error);
            statusIndicator.className = 'status-dot error';
        };
    </script>
</body>
</html>
